name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs-and-prototype:
    name: Document tower and prototype tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check links and identifiers across the docs
        run: node scripts/check-docs.mjs
      - name: Prototype unit tests
        run: npm test --prefix prototypes/tc-admin
