name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Document tower, Worker typecheck and tests, prototype tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Check
        run: npm run check
